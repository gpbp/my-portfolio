version: 0.2

phases:
  install:
    commands:
      - echo Installing dependencies...
      - npm ci

  build:
    commands:
      - echo Build started on `date`
      - echo Building Next.js app...
      - npm run build

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Uploading to S3...
      - aws s3 sync out/ s3://$S3_BUCKET/ --delete

artifacts:
  files:
    - "**/*"
  name: BuildArtifact
