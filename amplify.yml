version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Checking for lockfile and installing dependencies..."
            - if [ -f package-lock.json ]; then npm ci; else npm install; fi
        build:
          commands:
            - echo "Running build"
            - npm run build
      artifacts:
        # For Next.js, Amplify will use the .next folder for SSR/SSG outputs
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    # optional headers to harden responses from the CDN
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'X-Frame-Options'
            value: 'DENY'
