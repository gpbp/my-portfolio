version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MY_PORTFOLIO_BACKEND_API_URL=${MY_PORTFOLIO_BACKEND_API_URL:-http://localhost:8080}
    restart: unless-stopped
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
